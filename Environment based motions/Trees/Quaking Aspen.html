<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quaking Aspen (Populus tremuloides) - Clonal Flutter Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020406;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            box-shadow: 0 0 60px rgba(250, 204, 21, 0.15);
            border: 1px solid #0f172a;
            border-radius: 10px;
        }
        #aspen-hud {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #94a3b8;
            background: rgba(8, 13, 24, 0.93);
            padding: 22px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            pointer-events: none;
            font-size: 11px;
            font-family: monospace;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }
        .gold-highlight { color: #facc15; font-weight: bold; text-shadow: 0 0 6px rgba(250,204,21,0.3); }
        .colony-tag { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="aspen-hud">
        ORGANISM MATRIX: <span class="colony-tag">Clonal Root Colony (Pando Model)</span><br>
        TAXONOMY: <span style="color:#f43f5e; font-style:italic;">Populus tremuloides</span><br>
        PETIOLE DYNAMICS: <span style="color:#4ade80; font-weight:bold;">Flat Vector (High Frequency Flutter)</span><br>
        PHENOLOGY CYCLE: <span id="aspen-cycle" class="gold-highlight">SUMMER SHIMMER</span><br>
        CANOPY FREQUENCY: <span id="quake-freq" style="color:#fb923c">0 Hz</span>
    </div>

    <canvas id="aspenCanvas" width="1000" height="760"></canvas>

    <script>
        const canvas = document.getElementById('aspenCanvas');
        const ctx = canvas.getContext('2d');

        // Aspen Phenology Cycles
        const PHASES = ['SUMMER_SHIMMER', 'AUTUMN_GOLDEN_QUAKE', 'LATE_FALL_SHOWER', 'WINTER_SILENCE', 'SPRING_LEAFOUT'];
        let phaseIdx = 0;
        let phaseTimer = 0;
        const PHASE_DURATION = 400;

        let wind = 0.3;
        let targetWind = 0.3;
        let timeTracker = 0;

        // Colors: Aspen Bright Shimmering Greens & Electric Yellows
        const ASPEN_SUMMER = ['#16a34a', '#22c55e', '#15803d', '#4ade80'];
        const ASPEN_AUTUMN = ['#facc15', '#eab308', '#fef08a', '#fde047'];

        const branches = [];
        const barkScars = [];
        const leaves = [];
        const fallenGold = [];

        // 1. TALL SLENDER COLONIAL TRUNK GENERATOR WITH SCAR SYSTEM
        function growAspen(x, y, length, angle, depth, width) {
            const endX = x + Math.cos(angle) * length;
            const endY = y + Math.sin(angle) * length;

            branches.push({
                sx: x, sy: y, ex: endX, ey: endY,
                width: width, depth: depth
            });

            // Map eye-shaped dark scars along the main white trunk segments
            if (width > 6 && Math.random() < 0.4) {
                barkScars.push({
                    bx: x + (endX - x) * 0.5,
                    by: y + (endY - y) * 0.5,
                    radius: width * 0.6
                });
            }

            if (depth === 0) return;

            // Aspen architecture is graceful, high-reaching, and slender
            const splitCount = depth > 5 ? 2 : (Math.random() < 0.7 ? 3 : 2);
            for(let i=0; i<splitCount; i++) {
                const angleOffset = (i - (splitCount - 1) / 2) * 0.45 + (Math.random() - 0.5) * 0.15;
                const nextAngle = angle * 0.88 + angleOffset; // Push upward
                const nextLength = length * (0.75 + Math.random() * 0.08);
                const nextWidth = width * 0.68;

                growAspen(endX, endY, nextLength, nextAngle, depth - 1, nextWidth);
            }
        }

        // Initialize: White trunk cluster starting from interconnected loam root line
        growAspen(500, 630, 130, -Math.PI / 2, 8, 20);

        // 2. FLAT-PETIOLE HEART-SHAPED QUAKING LEAF NODE ENGINE
        class QuakingLeaf {
            constructor(parentTwig) {
                this.anchorX = parentTwig.ex + (Math.random() - 0.5) * 45;
                this.anchorY = parentTwig.ey + (Math.random() - 0.5) * 45;
                this.x = this.anchorX;
                this.y = this.anchorY;

                this.baseSize = 6 + Math.random() * 5;
                this.size = this.baseSize;
                this.angle = Math.random() * Math.PI * 2;

                this.summerColor = ASPEN_SUMMER[Math.floor(Math.random() * ASPEN_SUMMER.length)];
                this.autumnColor = ASPEN_AUTUMN[Math.floor(Math.random() * ASPEN_AUTUMN.length)];
                this.currentColor = this.summerColor;
                this.colorProgress = 0;

                this.attached = true;
                this.vx = 0; this.vy = 0;
                // High frequency oscillation constants mirroring flat petioles
                this.quakeFrequency = 0.25 + Math.random() * 0.3;
                this.phase = Math.random() * 100;
            }

            update() {
                this.phase += this.quakeFrequency;
                const currentPhase = PHASES[phaseIdx];

                if (this.attached) {
                    // THE QUAKING MECHANISM: High frequency micro-displacement based on current wind factor
                    const quakeAmplitude = wind * 4.2;
                    this.x = this.anchorX + Math.sin(this.phase * 2.5) * quakeAmplitude;
                    this.y = this.anchorY + Math.cos(this.phase * 3.0) * (quakeAmplitude * 0.4);
                    this.angle = Math.sin(this.phase * 4.0) * (wind * 0.5);

                    if (currentPhase === 'SUMMER_SHIMMER') {
                        this.currentColor = this.summerColor;
                        this.size = this.baseSize;
                        this.colorProgress = 0;
                    } 
                    else if (currentPhase === 'AUTUMN_GOLDEN_QUAKE') {
                        if (this.colorProgress < 1) this.colorProgress += 0.003;
                        this.currentColor = lerpAspenPalette(this.summerColor, this.autumnColor, this.colorProgress);
                    } 
                    else if (currentPhase === 'LATE_FALL_SHOWER') {
                        this.currentColor = this.autumnColor;
                        // High cascading leaf separation over duration matrix
                        const releaseChance = 0.001 + (phaseTimer / PHASE_DURATION) * 0.015;
                        if (Math.random() < releaseChance * wind) this.attached = false;
                    } 
                    else if (currentPhase === 'WINTER_SILENCE') {
                        this.attached = false; this.size = 0;
                    } 
                    else if (currentPhase === 'SPRING_LEAFOUT') {
                        this.attached = true;
                        this.currentColor = this.summerColor;
                        this.x = this.anchorX; this.y = this.anchorY;
                        
                        const scaleIn = Math.min(1, (phaseTimer / PHASE_DURATION) * 2.2);
                        this.size = this.baseSize * scaleIn;
                    }
                } else {
                    // GLIDING SHIMMER FLIGHT KINEMATICS
                    this.vy += 0.035;
                    this.vx += (wind * 0.1) + Math.sin(this.phase * 0.5) * 0.4;
                    this.vx *= 0.95; this.vy *= 0.96;

                    this.x += this.vx; this.y += this.vy;
                    this.angle += 0.08;

                    const floorY = 630 + Math.sin(this.x * 0.004) * 15;
                    if (this.y >= floorY) {
                        fallenGold.push({
                            x: this.x, y: floorY + (Math.random() * 6 - 3),
                            size: this.size, angle: this.angle, color: this.currentColor, alpha: 0.9
                        });
                        this.attached = true; this.size = 0; // Prepare for spring rebirth loops
                    }
                }
            }

            draw() {
                if (this.size <= 0.1) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.currentColor;

                // Cordate/Heart-shaped Aspen Leaf Vector Path Geometry
                ctx.beginPath();
                ctx.moveTo(0, this.size * 0.3); // Stem attachment base
                ctx.bezierCurveTo(-this.size * 1.1, -this.size * 0.3, -this.size * 0.8, -this.size * 1.1, 0, -this.size); // Left rounded profile to point
                ctx.bezierCurveTo(this.size * 0.8, -this.size * 1.1, this.size * 1.1, -this.size * 0.3, 0, this.size * 0.3); // Right rounded profile return
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize Canopy Arrays
        branches.forEach(b => {
            if (b.depth <= 4) {
                const densityCount = Math.floor(7 + Math.random() * 11);
                for(let i=0; i<densityCount; i++) leaves.push(new QuakingLeaf(b));
            }
        });

        function lerpAspenPalette(h1, h2, w) {
            let parse = (h) => parseInt(h.slice(1), 16);
            let rgb1 = parse(h1), rgb2 = parse(h2);
            let r = Math.round(((rgb1 >> 16) & 255) * (1 - w) + ((rgb2 >> 16) & 255) * w);
            let g = Math.round(((rgb1 >> 8) & 255) * (1 - w) + ((rgb2 >> 8) & 255) * w);
            let b = Math.round((rgb1 & 255) * (1 - w) + (rgb2 & 255) * w);
            return `rgb(${r},${g},${b})`;
        }

        // 3. MAIN RUNTIME LOOP
        function stepEcosystem() {
            phaseTimer++;
            timeTracker += 0.02;

            if (phaseTimer > PHASE_DURATION) {
                phaseTimer = 0;
                phaseIdx = (phaseIdx + 1) % PHASES.length;
            }

            const currentPhase = PHASES[phaseIdx];

            // Wind and Frequency Dashboard Calibrations
            let phaseTxt = "", frequencyTxt = "0 Hz";
            if (currentPhase === 'SUMMER_SHIMMER') {
                phaseTxt = "SUMMER RESILIENCE SHIMMER";
                targetWind = 0.3 + Math.sin(timeTracker) * 0.15;
                frequencyTxt = Math.round(18 + targetWind * 10) + " Hz (Active Flutter)";
            } else if (currentPhase === 'AUTUMN_GOLDEN_QUAKE') {
                phaseTxt = "CLONAL CHROMATIC FLUSH (GOLD)";
                targetWind = 0.6 + Math.sin(timeTracker * 1.5) * 0.3;
                frequencyTxt = Math.round(26 + targetWind * 12) + " Hz (Vibrant Quake)";
            } else if (currentPhase === 'LATE_FALL_SHOWER') {
                phaseTxt = "SYNCHRONOUS HARVEST SHOWER";
                targetWind = 1.6 + Math.sin(phaseTimer * 0.05) * 0.8; // Gusty fall fronts
                frequencyTxt = "Shedding Shearing State";
            } else if (currentPhase === 'WINTER_SILENCE') {
                phaseTxt = "ROOT-COLONY QUIESCENCE";
                targetWind = 0.4;
                frequencyTxt = "0 Hz (Dormant)";
            } else if (currentPhase === 'SPRING_LEAFOUT') {
                phaseTxt = "BIOMASS CLONAL REGENERATION";
                targetWind = 0.25;
                frequencyTxt = "9 Hz (Soft Bud Expansion)";
                if (fallenGold.length > 0) fallenGold.splice(0, 2); // Loam recycling
            }

            wind += (targetWind - wind) * 0.04;

            document.getElementById('aspen-cycle').innerText = phaseTxt;
            document.getElementById('quake-freq').innerText = frequencyTxt;

            // Render High Altitude Blue Sky Background
            let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (currentPhase === 'SUMMER_SHIMMER') {
                sky.addColorStop(0, '#020914'); sky.addColorStop(1, '#010305');
            } else if (currentPhase === 'AUTUMN_GOLDEN_QUAKE' || currentPhase === 'LATE_FALL_SHOWER') {
                sky.addColorStop(0, '#0c1514'); sky.addColorStop(0.7, '#04070a'); sky.addColorStop(1, '#010203'); // Contrasting crisp atmosphere
            } else {
                sky.addColorStop(0, '#010205'); sky.addColorStop(1, '#000000');
            }
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. RENDER ICONIC BONE-WHITE SMOOTH TRUNK LAYER
            branches.forEach(b => {
                ctx.save();
                ctx.lineCap = 'round';
                // Chalky bone-white wood bark profile configuration
                const greyShade = Math.max(25, 80 - b.depth * 5);
                ctx.strokeStyle = `rgb(${greyShade + 12}, ${greyShade + 15}, greyShade + 15)`;
                ctx.lineWidth = b.width;
                ctx.beginPath();
                ctx.moveTo(b.sx, b.sy);
                ctx.lineTo(b.ex, b.ey);
                ctx.stroke();
                ctx.restore();
            });

            // 2. RENDER DARK EYE SCAR SEGMENTS ALONG TRUNK
            barkScars.forEach(scar => {
                ctx.save();
                ctx.fillStyle = '#0f172a'; // Deep charcoal black eye marks
                ctx.beginPath();
                // Draw diamond/eye elliptical scars typical of populus bark
                ctx.ellipse(scar.bx, scar.by, scar.radius, scar.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 3. EXECUTE HIGH-FREQUENCY FLUTTER LEAVES
            leaves.forEach(leaf => {
                leaf.update();
                leaf.draw();
            });

            // 4. RENDER GOLDEN GROUND CARPET FLOOR MAT
            for (let i = fallenGold.length - 1; i >= 0; i--) {
                let fg = fallenGold[i];
                if (currentPhase === 'WINTER_SILENCE' && phaseTimer > PHASE_DURATION * 0.5) fg.alpha -= 0.004;
                if (fg.alpha <= 0) {
                    fallenGold.splice(i, 1); continue;
                }
                ctx.save();
                ctx.globalAlpha = fg.alpha;
                ctx.translate(fg.x, fg.y);
                ctx.rotate(fg.angle);
                ctx.fillStyle = fg.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, fg.size * 0.7, fg.size * 0.4, 0, 0, Math.PI * 2); // Overlapping golden layers
                ctx.fill();
                ctx.restore();
            }

            // 5. DRAW CLONAL INTERCONNECTED LOAM SUBSTRATE LAYER
            ctx.fillStyle = '#020406';
            ctx.beginPath();
            ctx.moveTo(0, 760);
            for (let x = 0; x <= 1000; x += 25) {
                ctx.lineTo(x, 630 + Math.sin(x * 0.004) * 15);
            }
            ctx.lineTo(1000, 760);
            ctx.fill();

            requestAnimationFrame(stepEcosystem);
        }

        stepEcosystem();
    </script>
</body>
</html>
