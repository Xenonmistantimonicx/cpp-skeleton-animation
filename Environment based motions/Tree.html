<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Tree Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            background: linear-gradient(to bottom, #1a1c2e, #0d0e15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ui {
            position: absolute;
            top: 20px;
            color: #fff;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="ui">Spring / Summer</div>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');

        // Animation state variables
        let timer = 0;
        let currentSeason = 'SUMMER'; // SUMMER, AUTUMN, WINTER, REGROWTH
        const SEASON_DURATION = 300; // frames per season

        const leaves = [];
        const fallenLeaves = [];

        // Colors based on seasons
        const summerColors = ['#2e6f40', #3b8c4c', '#4fa65d', '#1e4d2b'];
        const autumnColors = ['#d95d16', '#e68a19', '#c23b22', '#e6b419'];

        // Static Branch Structure Definition (Generated once for consistency)
        const branches = [];
        function generateBranches(startX, startY, len, angle, branchWidth) {
            const endX = startX + Math.cos(angle) * len;
            const endY = startY + Math.sin(angle) * len;
            
            branches.push({ startX, startY, endX, endY, branchWidth });

            if (len < 15) return;

            // Left branch
            generateBranches(endX, endY, len * 0.75, angle - 0.4 - Math.random() * 0.2, branchWidth * 0.7);
            // Right branch
            generateBranches(endX, endY, len * 0.75, angle + 0.4 + Math.random() * 0.2, branchWidth * 0.7);
            // Occasional middle branch
            if (Math.random() > 0.6) {
                generateBranches(endX, endY, len * 0.6, angle + (Math.random() - 0.5) * 0.3, branchWidth * 0.7);
            }
        }
        // Initialize tree structure
        generateBranches(400, 520, 110, -Math.PI / 2, 14);

        // Leaf Class
        class Leaf {
            constructor(branch) {
                // Attach near the tips of branches
                this.anchorX = branch.endX + (Math.random() - 0.5) * 20;
                this.anchorY = branch.endY + (Math.random() - 0.5) * 20;
                this.x = this.anchorX;
                this.y = this.anchorY;
                this.size = 4 + Math.random() * 5;
                
                // Colors and lifecycle
                this.summerColor = summerColors[Math.floor(Math.random() * summerColors.length)];
                this.autumnColor = autumnColors[Math.floor(Math.random() * autumnColors.length)];
                this.color = this.summerColor;
                this.colorProgress = 0; // transitions 0 to 1 in autumn
                
                // Physics for falling
                this.isFalling = false;
                this.vx = 0;
                this.vy = 0;
                this.swingSpeed = 0.05 + Math.random() * 0.05;
                this.swingRange = 1 + Math.random() * 2;
                this.swingAngle = Math.random() * Math.PI * 2;
                
                // Growth phase
                this.scale = 1; 
            }

            update() {
                // Handle Seasonal Transitions
                if (currentSeason === 'SUMMER') {
                    this.color = this.summerColor;
                    this.isFalling = false;
                    this.x = this.anchorX;
                    this.y = this.anchorY;
                    this.scale = 1;
                } 
                else if (currentSeason === 'AUTUMN') {
                    // Gradual color shift to autumn tones
                    if (this.colorProgress < 1) this.colorProgress += 0.005;
                    this.color = lerpColor(this.summerColor, this.autumnColor, this.colorProgress);

                    // Trigger falling organically over time
                    if (!this.isFalling && Math.random() < 0.003 * (timer / SEASON_DURATION)) {
                        this.isFalling = true;
                        this.vy = 1 + Math.random() * 1.5;
                        this.vx = 0.5 + Math.random() * 1;
                    }
                } 
                else if (currentSeason === 'WINTER') {
                    // Force any remaining leaves to fall
                    if (!this.isFalling) {
                        this.isFalling = true;
                        this.vy = 1 + Math.random() * 1.5;
                        this.vx = 0.5 + Math.random() * 1;
                    }
                }
                else if (currentSeason === 'REGROWTH') {
                    this.isFalling = false;
                    this.colorProgress = 0;
                    this.color = this.summerColor;
                    // Leaves gradually scale up from zero size
                    this.scale = Math.min(1, timer / (SEASON_DURATION * 0.8));
                    this.x = this.anchorX;
                    this.y = this.anchorY;
                }

                // Falling Leaf Physics
                if (this.isFalling) {
                    this.swingAngle += this.swingSpeed;
                    this.x += this.vx + Math.sin(this.swingAngle) * this.swingRange;
                    this.y += this.vy;

                    // Check floor collision
                    if (this.y >= 520 + (Math.random() * 10 - 5)) {
                        this.isFalling = false;
                        // Move to ground array to optimize performance and fade out safely
                        fallenLeaves.push({
                            x: this.x,
                            y: this.y,
                            size: this.size,
                            color: this.color,
                            alpha: 1
                        });
                        // Teleport original leaf out of sight until rebirth
                        this.scale = 0;
                        this.x = -100;
                        this.y = -100;
                    }
                }
            }

            draw() {
                if (this.scale <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                // Draw leaf shape
                ctx.ellipse(0, 0, this.size * this.scale, (this.size / 2) * this.scale, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize leaves on small/outer branches
        branches.forEach(branch => {
            if (branch.branchWidth < 6) { 
                const leafCount = Math.floor(5 + Math.random() * 6);
                for (let i = 0; i < leafCount; i++) {
                    leaves.push(new Leaf(branch));
                }
            }
        });

        // Helper function to blend summer and autumn colors smoothly
        function lerpColor(color1, color2, weight) {
            const c1 = parseInt(color1.slice(1), 16);
            const c2 = parseInt(color2.slice(1), 16);
            const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
            const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
